# Runs only while the compositor reports an actual session lock.
general {
    ignore_dbus_inhibit = true
    ignore_systemd_inhibit = true
    ignore_wayland_inhibit = true
    inhibit_sleep = 0
}

listener {
    timeout = 30
    on-timeout = ~/.config/hypr/scripts/hypr-do.sh dpms off
    on-resume = ~/.config/hypr/scripts/hypr-do.sh dpms on
}
