# ----------------------------------------------------------------------
# Projects — workflow.run resolves workspace_path from these. Without an
# entry (and without a focused terminal emitting cwd), workflow.run fails
# with `no_workspace`. Register the repos you launch workflows against.
# ----------------------------------------------------------------------
[[projects]]
name = "copad"
path = "/home/marshall/dev/copad"
description = "Cross-platform custom terminal emulator"
aliases = ["term", "terminal"]
git_remote = "marshallku/copad"

[terminal]
shell = "/bin/zsh"
font_family = "JetBrainsMono Nerd Font Mono"
font_size = 11

[background]
#image = "/mnt/disk2/Wallpapers/02.jpg"
tint = 0
opacity = 0.21
tint_color = "#000000"
rotate_interval = 300  # native rotation (replaces copad-random-bg.sh daemon)

# Ghostty-model window transparency. Only the background fades; text stays
# opaque (unlike the old Hyprland `windowrule opacity`, which dimmed glyphs
# too — that rule is removed for copad in hyprland.conf:368). Blur behind the
# window comes free from Hyprland's decoration:blur.
#
# `background` = solid base color blended with the desktop at `opacity`.
# opacity is the fraction of `background` that stays maintained over the
# desktop, so #000 at 0.85 keeps a dark base under the text on any wallpaper.
# Lower opacity for more see-through; raise it (or keep background dark) for
# readability. Defaults to the theme background when unset.
[window]
opacity = 0.82
background = "#000000"
blur = false

[socket]
# path = "/tmp/custerm.sock"

[theme]
name = "catppuccin-mocha"
#name = "dracula"

[tabs]
position = 'left'
#position = 'top'
width = 200

# Bottom status bar re-enabled for the pomodoro countdown. It was off
# because pilot/todo/presence are sparse and event-shaped — they leave the
# bar empty most of the day, and ambient stats already live in waybar /
# tmux / the zsh prompt. The pomodoro timer is the opposite: a value that
# changes every second and is useless as a notification, so it needs a
# persistent surface. The sparse modules stay blank when idle (the bar does
# not collapse them), so they cost a slot, not noise.
[statusbar]
enabled = true

# ~/.local/bin spelled out — a desktop-entry-launched copad's PATH may
# not include it (same gotcha as plugin exec resolution).
[keybindings]
"ctrl+shift+y" = "spawn:~/.local/bin/coctl background toggle"
"ctrl+shift+bracketright" = "spawn:~/.local/bin/coctl background next"
"ctrl+shift+d" = "spawn:~/.local/bin/coctl background delete-current"
# Pomodoro start/pause/resume in one chord. `m` because the built-ins take
# p (command palette) and y (agent cockpit — itself already shadowed above).
"ctrl+shift+m" = "spawn:~/.local/bin/coctl pomodoro toggle"

# ----------------------------------------------------------------------
# Vision Flow 3 — click "Start" on a Todo → fresh worktree → claude
# session in tmux with the layered prompt pre-pasted.
# Mirror of examples/triggers/vision-flow-3.toml.
# ----------------------------------------------------------------------

# Todo with linked_jira → branch from sanitized Jira key.
[[triggers]]
name = "vision3-start-with-jira"
action = "git.worktree_add"
params = { workspace = "{event.workspace}", branch = "{event.linked_jira}", sanitize_jira = true, prompt = "{event.assembled_prompt}" }
condition = "event.linked_jira != null"
[triggers.when]
event_kind = "todo.start_requested"

# Todo without linked_jira → branch `todo-<id>`.
[[triggers]]
name = "vision3-start-without-jira"
action = "git.worktree_add"
params = { workspace = "{event.workspace}", branch = "todo-{event.id}", prompt = "{event.assembled_prompt}" }
condition = "event.linked_jira == null"
[triggers.when]
event_kind = "todo.start_requested"

# Once the worktree exists, drop a Claude session there with the
# layered prompt pre-seeded. `event.prompt` is the passthrough field
# echoed by git.worktree_add (NOT the raw Todo prompt frontmatter).
[[triggers]]
name = "vision3-claude-after-worktree"
action = "claude.start"
params = { workspace_path = "{event.path}", prompt = "{event.prompt}" }
[triggers.when]
event_kind = "git.worktree_add.completed"

# Starting a Todo also starts the focus timer, labelled with the todo
# title. The pomodoro plugin has no knowledge of todo — this trigger IS
# the coupling, so deleting this block fully decouples them again.
# Mirror of plugins/pomodoro/triggers.example.toml.
[[triggers]]
name = "pomodoro-on-todo-start"
action = "pomodoro.start"
params = { label = "{event.title}" }
[triggers.when]
event_kind = "todo.start_requested"

# ====================================================================
# 📝 reaction → Todo capture (Discord + Slack)
# --------------------------------------------------------------------
# React with 📝 on a Discord/Slack message → copad captures the
# body + permalink as a Todo. Click Start in the Todo panel to
# spawn a worktree + claude session with the captured context in
# the layered prompt (vision-flow-3 chain).
#
# 🔧 EMOJI CONFIG — change EXACTLY ONE line per platform:
#   Discord: line marked  ◀ EMOJI HERE  in discord-memo-capture-fetch
#   Slack:   line marked  ◀ EMOJI HERE  in slack-memo-capture-fetch
#
# Discord uses unicode literals: "📝", "⭐", "🔖", "🐛", ...
# Slack uses reaction NAMES (no colons): "memo" = 📝,
#   "bookmark" = 🔖, "star" = ⭐, "pushpin" = 📌, "fire" = 🔥,
#   "white_check_mark" = ✅. Find any emoji's name via Slack's
#   emoji picker tooltip — drop the colons.
# ====================================================================

[[triggers]]
name = "discord-memo-capture-fetch"
action = "discord.get_message"
params = { channel_id = "{event.channel_id}", message_id = "{event.message_id}" }
condition = """event.emoji_name == "📝" """          # ◀ EMOJI HERE (Discord)
[triggers.when]
event_kind = "discord.reaction"
[triggers.await]
event_kind = "discord.get_message.completed"
timeout_seconds = 10
on_timeout = "abort"

[[triggers]]
name = "discord-memo-capture-create"
action = "todo.create"
# Title kept short and stable (always populated, never gets cut off
# in the kanban). Body has the full content + the URL so a future
# claude session with a Slack/Discord-link MCP tool can re-resolve
# context. Interpolation DSL has no truncate/fallback, so deriving
# the title from content directly would break on empty-content
# messages (image-only reacts) and explode on 2000-char ones.
params = { title = "Discord capture {event.message_id}", body = """
{event.await.content}

Source: {event.message_url}
""", workspace = "default" }
[triggers.when]
event_kind = "discord-memo-capture-fetch.awaited"

[[triggers]]
name = "slack-memo-capture-fetch"
action = "slack.get_message"
params = { channel = "{event.channel}", ts = "{event.ts}" }
condition = """event.reaction == "memo" """          # ◀ EMOJI HERE (Slack — name, no colons)
[triggers.when]
event_kind = "slack.reaction"
[triggers.await]
event_kind = "slack.get_message.completed"
timeout_seconds = 10
on_timeout = "abort"

[[triggers]]
name = "slack-memo-capture-create"
action = "todo.create"
# Same shape as discord-memo-capture-create. event.permalink may
# be null when chat.getPermalink failed at event time (rare —
# usually a missing scope on the bot token).
params = { title = "Slack capture {event.ts}", body = """
{event.await.text}

Source: {event.permalink}
""", workspace = "default" }
[triggers.when]
event_kind = "slack-memo-capture-fetch.awaited"

# ----------------------------------------------------------------------
# Hyprland WebKit panel-freeze auto-cure (WR-2). See
# docs/troubleshooting.md and examples/triggers/hyprland-webkit-fix.toml.
# ----------------------------------------------------------------------
[[triggers]]
name = "hyprland-webkit-cure"
action = "system.spawn"
params = { argv = ["sh", "-c", "hyprctl dispatch resizewindowpixel '1 0,class:com.marshall.copad' && hyprctl dispatch -- resizewindowpixel '-1 0,class:com.marshall.copad'"] }
[triggers.when]
event_kind = "window.restored"
# Privileged-action opt-in (commit d03a01a). Without this, the new
# trust-boundary gate skips system.spawn on every fire.
[triggers.security]
allow_privileged = true

# ----------------------------------------------------------------------
# Claude harness hook → desktop toast (Option A slice 1A, commit 28a0b6a).
# Mirror of examples/triggers/claude-hooks.toml. accept_external = true
# because these fire on `coctl event publish` calls made from
# `~/.claude/scripts/*.sh` hooks (External origin per trust boundary #37).
# ----------------------------------------------------------------------

[[triggers]]
name = "claude-commit-blocked-toast"
action = "notify.show"
params = { title = "Commit blocked", body = "{event.reason}", level = "warn" }
[triggers.when]
event_kind = "claude.commit_blocked"
[triggers.security]
accept_external = true

[[triggers]]
name = "claude-commit-blocked-discord"
action = "discord.send_message"
params = { channel_id = "1507255807132176394", content = ":no_entry: commit blocked in `{event.repo}`: {event.reason}" }
condition = 'context.presence == "away"'
[triggers.when]
event_kind = "claude.commit_blocked"
[triggers.security]
accept_external = true

[[triggers]]
name = "claude-review-approved-toast"
action = "notify.show"
params = { title = "Codex review approved", body = "session {event.session}", level = "info" }
[triggers.when]
event_kind = "claude.review_approved"
[triggers.security]
accept_external = true

[[triggers]]
name = "claude-review-approved-discord"
action = "discord.send_message"
params = { channel_id = "1507255807132176394", content = ":white_check_mark: codex review APPROVED (session `{event.session}`)" }
condition = 'context.presence == "away"'
[triggers.when]
event_kind = "claude.review_approved"
[triggers.security]
accept_external = true
