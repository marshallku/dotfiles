splash = false

# Active wallpaper is a stable symlink; swap it via:
#   ~/.config/hypr/scripts/wallpaper.sh <image|random|next|prev>
$wallpaper = /home/marshall/Pictures/Wallpapers/.current

# An empty monitor applies this to every output, which is what the three
# per-port blocks (HDMI-A-1 / DP-1 / eDP-1) were reaching for. They enumerated
# connector names, so the ultrawide silently lost its wallpaper the moment it
# came up on DP-2 instead — the same fragility hyprland.lua avoids by matching
# outputs on `desc:`. Every output wants the same wallpaper, so one block does it.
wallpaper {
    monitor   =
    path      = $wallpaper
    fit_mode  = cover
}
